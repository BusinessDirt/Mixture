name: Build C++ Project

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # Customize this to match the name of the solution/project Premake generates
  PROJECT_NAME: "Mixture"
  BUILD_CONFIG: "Release"
  CI: "true"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            setup_script: ./Scripts/Setup-Unix.sh
            # Premake usually outputs a standard Makefile on Linux
            build_command: make config=release
            shell: bash

          - os: windows-latest
            setup_script: ./Scripts/Setup-Windows.ps1
            # MSBuild automatically finds the .sln file if only one exists
            build_command: msbuild /p:Configuration=Release /p:Platform=x64
            shell: pwsh

          - os: macos-14 # Apple Silicon (ARM)
            setup_script: ./Scripts/Setup-Unix.sh
            # Build the workspace/project generated by Premake
            build_command: xcodebuild -configuration Release
            shell: bash

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # Helper in case your engine relies on submodules

    # --- Python Setup (Required for Setup Scripts) ---
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        pip install requests

    # --- Vulkan SDK Setup ---

    # Linux (Ubuntu)
    - name: Install Vulkan SDK (Linux)
      if: runner.os == 'Linux'
      run: |
        wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
        sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-jammy.list https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-jammy.list
        sudo apt-get update
        sudo apt-get install -y vulkan-sdk

    # Windows
    - name: Install Vulkan SDK (Windows)
      if: runner.os == 'Windows'
      run: |
        curl -o VulkanSDK.exe https://sdk.lunarg.com/sdk/download/1.3.290.0/windows/VulkanRT-1.3.290.0-Installer.exe
        ./VulkanSDK.exe /S
        # Add Vulkan to GITHUB_ENV so subsequent steps can find it if needed
        echo "VULKAN_SDK=C:\VulkanSDK\1.3.290.0" >> $env:GITHUB_ENV
      shell: pwsh

    # macOS
    - name: Install Vulkan SDK (macOS)
      if: runner.os == 'macOS'
      run: |
        wget https://sdk.lunarg.com/sdk/download/1.3.290.0/mac/vulkansdk-macos-1.3.290.0.dmg -O /tmp/vulkansdk.dmg
        hdiutil attach /tmp/vulkansdk.dmg -mountpoint /Volumes/vulkan
        sudo /Volumes/vulkan/InstallVulkan.app/Contents/MacOS/InstallVulkan --root /usr/local --accept-licenses --default-answer --confirm-command install
        hdiutil detach /Volumes/vulkan
        # Set ENV var for the build step
        echo "VULKAN_SDK=/usr/local" >> $GITHUB_ENV

    # --- Project Generation (Premake) ---
    - name: Make Scripts Executable (Unix)
      if: runner.os != 'Windows'
      run: chmod +x ./Scripts/Setup-Unix.sh

    - name: Run Setup Script
      run: ${{ matrix.setup_script }}
      # We explicitly use bash for Unix and pwsh for Windows
      shell: bash
      if: runner.os != 'Windows'

    - name: Run Setup Script (Windows)
      run: ${{ matrix.setup_script }}
      shell: pwsh
      if: runner.os == 'Windows'

    # --- Compile / Build ---

    - name: Build Project (Unix)
      if: runner.os != 'Windows'
      run: ${{ matrix.build_command }}
      shell: bash

    - name: Build Project (Windows)
      if: runner.os == 'Windows'
      run: ${{ matrix.build_command }}
      shell: pwsh
