name: Build

on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  # Customize this to match the name of the solution/project Premake generates
  PROJECT_NAME: "Mixture"
  BUILD_CONFIG: "Release"
  CI: "true"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-late1st
            name: Ubuntu 24.04
            setup_script: bash ./Scripts/Setup-Unix.sh
            build_command: make -j$(nproc) config=release
            dependency_command: sudo apt upgrade && sudo apt install libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libwayland-dev libxkbcommon-dev

          - os: windows-latest
            name: Windows
            setup_script: pwsh ./Scripts/Setup-Windows.ps1
            build_command: msbuild /p:Configuration=Release /p:Platform=x64
            dependency_command:

          - os: macos-latest
            name: MacOS
            setup_script: bash ./Scripts/Setup-Unix.sh
            build_command: xcodebuild -workspace Mixture.xcworkspace -scheme Tests -configuration Release
            dependency_command:

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: ${{ matrix.dependency_command }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Universal SDK Installer
    - name: Install Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        vulkan_version: 1.3.296.0
        cache: true
        optional_components: com.lunarg.vulkan.vma

    - name: Run Setup Script
      run: ${{ matrix.setup_script }}

    - name: Test Setup Utilities
      run: python -m unittest discover -s Scripts/python/tests -v

    - name: Setup MSBuild
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Build
      run: ${{ matrix.build_command }}

    - name: Run Tests
      run: python Scripts/python/RunTests.py --configuration Release --output test-results/results.xml

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: test-results/results.xml
        if-no-files-found: warn
