name: Build

on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  # Customize this to match the name of the solution/project Premake generates
  PROJECT_NAME: "Mixture"
  BUILD_CONFIG: "Release"
  CI: "true"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            setup_script: ./Scripts/Setup-Unix.sh
            # Premake usually outputs a standard Makefile on Linux
            build_command: make config=release
            shell: bash

          - os: windows-latest
            setup_script: ./Scripts/Setup-Windows.ps1
            # MSBuild automatically finds the .sln file if only one exists
            build_command: msbuild /p:Configuration=Release /p:Platform=x64
            shell: pwsh

          - os: macos-14 # Apple Silicon (ARM)
            setup_script: ./Scripts/Setup-Unix.sh
            # Build the workspace/project generated by Premake
            build_command: xcodebuild -workspace Mixture.xcworkspace -scheme Tests -configuration Release
            shell: bash

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive # Helper in case your engine relies on submodules

    # --- Python Setup (Required for Setup Scripts) ---
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        pip install requests

    # --- Vulkan SDK Setup ---

    # Linux Dependencies (The action does not install system libs)
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev

    # Universal SDK Installer
    - name: Install Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        vulkan_version: 1.3.290.0
        cache: true
        optional_components: com.lunarg.vulkan.vma
        # Optional: Include specific components if needed (e.g., for older versions or specific needs)
        # For 1.3.290, VMA and DXC are typically included or standard.

    # --- Project Generation (Premake) ---
    - name: Make Scripts Executable (Unix)
      if: runner.os != 'Windows'
      run: chmod +x ./Scripts/Setup-Unix.sh

    - name: Run Setup Script
      run: ${{ matrix.setup_script }}
      # We explicitly use bash for Unix and pwsh for Windows
      shell: bash
      if: runner.os != 'Windows'

    - name: Run Setup Script (Windows)
      run: ${{ matrix.setup_script }}
      shell: pwsh
      if: runner.os == 'Windows'

    # --- Compile / Build ---

    - name: Build Project (Unix)
      if: runner.os != 'Windows'
      run: ${{ matrix.build_command }}
      shell: bash

    # Setup MSBuild (REQUIRED for Windows)
    - name: Setup MSBuild
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    # Build Project (Windows)
    - name: Build Project (Windows)
      if: runner.os == 'Windows'
      run: msbuild /p:Configuration=Release /p:Platform=x64
      shell: pwsh
