name: CI

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest  # Uses 24.04. Solves the "GLIBC_2.38" error.
    env:
      CI: true
      VULKAN_SDK: /usr

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        # We only need build-essential (includes GCC) and libraries.
        # No clang or complex version pinning needed.
        sudo apt-get install -y build-essential libgl1-mesa-dev xorg-dev xvfb wget gnupg ca-certificates

    - name: Setup Vulkan SDK
      run: |
        wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
        # Uses 'noble' repo for 24.04
        sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list http://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
        sudo apt-get update
        sudo apt-get install -y vulkan-sdk

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python Requests
      run: pip install requests

    - name: Run Project Setup
      run: |
        chmod +x Scripts/Setup-Unix.sh
        bash Scripts/Setup-Unix.sh

    - name: Build
      run: |
        # Premake defaults to GCC on Linux.
        # We don't set CC/CXX, so it uses the system default (GCC 14).
        make config=debug

    - name: Run Tests
      run: |
        TEST_BIN=$(find bin -name Tests -type f -executable | head -n 1)
        if [ -z "$TEST_BIN" ]; then
          echo "Test binary not found!"
          exit 1
        fi
        echo "Found test binary: $TEST_BIN"
        
        xvfb-run --auto-servernum "$TEST_BIN"
