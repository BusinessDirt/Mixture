name: CI

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    # UPDATED: Explicitly use 24.04 to match the "noble" Vulkan repo and GCC 13 headers
    runs-on: ubuntu-24.04 
    env:
      CI: true

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        # UPDATED: Added gcc-multilib and g++-multilib to fix potential 32-bit build issues
        # UPDATED: explicitly ensuring gcc/g++ are present
        sudo apt-get install -y build-essential gcc-multilib g++-multilib libgl1-mesa-dev xorg-dev xvfb wget gnupg ca-certificates

    - name: Setup Vulkan SDK
      run: |
        # UPDATED: Replaced deprecated apt-key with gpg dearmor
        wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo gpg --dearmor -o /usr/share/keyrings/lunarg-archive-keyring.gpg
        
        # We can safely use the noble list now that we are running on ubuntu-24.04
        sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list http://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
        
        # Update apt to recognize the new keys
        echo "deb [signed-by=/usr/share/keyrings/lunarg-archive-keyring.gpg] http://packages.lunarg.com/vulkan noble main" | sudo tee /etc/apt/sources.list.d/lunarg-vulkan-noble.list
        
        sudo apt-get update
        sudo apt-get install -y vulkan-sdk

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python Requests
      run: pip install requests

    - name: Run Project Setup
      run: |
        chmod +x Scripts/Setup-Unix.sh
        bash Scripts/Setup-Unix.sh

    - name: Build
      run: |
        make config=debug

    - name: Run Tests
      run: |
        TEST_BIN=$(find bin -name Tests -type f -executable | head -n 1)
        if [ -z "$TEST_BIN" ]; then
          echo "Test binary not found!"
          exit 1
        fi
        echo "Found test binary: $TEST_BIN"
        
        xvfb-run --auto-servernum "$TEST_BIN"
